<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>资产账本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="资产账本">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f2; --card:#fcfcfb; --line:#e6e5e0; --text:#0b0b0b; --text2:#52514e; --text3:#8a8983;
  --accent:#2a78d6; --accent-soft:#e3eefb; --up:#d03b3b; --down:#0a7d0a; --danger:#d03b3b; --grid:#e9e8e3;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#111110; --card:#1a1a19; --line:#30302d; --text:#f0efec; --text2:#c3c2b7; --text3:#8f8e86;
  --accent:#3987e5; --accent-soft:#1b2f4a; --up:#e66767; --down:#2fb52f; --danger:#e66767; --grid:#2a2a28;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
#app{min-height:100%;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 84px);max-width:560px;margin:0 auto}
h1{font-size:26px;margin:4px 4px 12px;font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.muted{color:var(--text2);font-size:13px}
.tiny{color:var(--text3);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;text-align:center}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:none;color:var(--danger);font-weight:500}
.btn+.btn{margin-top:10px}
.btn:active,.row:active,.tab:active{opacity:.6}

/* month nav */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav button.arrow{width:44px;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-size:20px;color:var(--accent)}
.mnav button.arrow:disabled{opacity:.3}
.mnav .title{font-size:20px;font-weight:700;text-align:center}
.mnav .title small{display:block;font-size:12px;font-weight:400;color:var(--text3)}

.hero .label{font-size:13px;color:var(--text2)}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.hero .delta{font-size:14px}

.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;margin:18px 0 6px;font-size:13px;color:var(--text2)}
.group-h b{color:var(--text);font-weight:600}
.list{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .l{min-width:0;flex:1}
.row .name{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;flex-shrink:0}
.row .amt{font-size:16px;font-weight:600}
.row .chev{color:var(--text3);margin-left:2px}

.empty{text-align:center;padding:28px 12px}
.empty .ico{font-size:40px}
.empty p{color:var(--text2);margin:8px 0 18px}

.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;margin-bottom:12px}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:14px;color:var(--text2)}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.small{display:inline-flex;margin:0}
.seg.small button{padding:4px 12px;font-size:12px;white-space:nowrap}

.chart-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chart-h .t{font-weight:600}
.tip{display:flex;justify-content:space-between;align-items:baseline;min-height:26px;margin-bottom:2px}
.tip .v{font-size:20px;font-weight:700}
.chart{touch-action:pan-y;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--text3);font-size:10.5px;font-variant-numeric:tabular-nums}

.bar-row{margin:10px 0}
.bar-row .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
.bar-row .track{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
.bar-row .fill{height:100%;border-radius:4px;background:var(--accent);min-width:2px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--text3);font-size:12px;text-align:right;padding:6px 0}
td{padding:9px 0;border-top:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
tr.sel td{font-weight:700}

.stat2{display:flex;gap:12px}
.stat2>div{flex:1}
.stat2 .v{font-size:22px;font-weight:700}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 0 calc(env(safe-area-inset-bottom) + 4px);z-index:5}
.tab{flex:1;text-align:center;font-size:11px;color:var(--text3);padding:4px 0}
.tab svg{display:block;margin:0 auto 2px;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

/* sheet */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none;align-items:flex-end;justify-content:center}
#mask.show{display:flex}
#sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);
  max-height:92%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 14px}
.sheet-h b{font-size:17px}
.sheet-h button{color:var(--accent);font-size:16px;padding:4px}
.field{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--text3)}
.field input,.field select{width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:17px;padding:4px 0;outline:none;
  -webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text;border-radius:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.chip{padding:7px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--text2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:rgba(20,20,20,.88);color:#fff;
  padding:9px 16px;border-radius:20px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs"></nav>
<div id="mask"><div id="sheet"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= 数据 ================= */
const KEY = 'zichan_data_v1';
const DEFAULT_CATS = ['银行存款','电子钱包','股票基金','理财保险','家人资产','其他'];
const CYCLES = {month:{t:'每月',m:1}, quarter:{t:'每季度',m:3}, half:{t:'每半年',m:6}, year:{t:'每年',m:12}};
let D = load();
function blank(){ return {v:1, months:{}, expenses:[], cats:DEFAULT_CATS.slice(), lastBackup:null}; }
function normalize(d){
  if(!d || typeof d!=='object' || typeof d.months!=='object') return null;
  d.expenses = Array.isArray(d.expenses)?d.expenses:[];
  d.cats = Array.isArray(d.cats)&&d.cats.length?d.cats:DEFAULT_CATS.slice();
  for(const k of Object.keys(d.months)){
    if(!/^\d{4}-\d{2}$/.test(k) || !Array.isArray(d.months[k].items)){ delete d.months[k]; continue; }
    d.months[k].items.forEach(it=>{ it.amount = Number(it.amount)||0; it.name=String(it.name||''); it.cat=String(it.cat||'其他'); if(!it.id) it.id=uid(); });
  }
  d.expenses.forEach(e=>{ e.amount=Number(e.amount)||0; if(!CYCLES[e.cycle]) e.cycle='month'; if(!e.id) e.id=uid(); });
  return d;
}
function load(){ try{ const d=normalize(JSON.parse(localStorage.getItem(KEY))); if(d) return d; }catch(e){} return blank(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){ alert('保存失败：'+e.message); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ================= 工具 ================= */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n=>Math.round(n*100)/100;
function money(n){ return '¥'+r2(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function compact(n){ const a=Math.abs(n);
  if(a>=1e8) return trim(n/1e8,2)+'亿'; if(a>=1e4) return trim(n/1e4,a>=1e6?0:1)+'万'; return String(Math.round(n)); }
function trim(n,d){ return String(parseFloat(n.toFixed(d))); }
function signed(n){ return (n>0?'+':n<0?'−':'')+money(Math.abs(n)).slice(1); }
function deltaHTML(cur,prev,withPct){
  if(prev==null) return '';
  const d=r2(cur-prev); if(!d) return '<span class="tiny">持平</span>';
  const pct = withPct && prev ? '（'+(d>0?'+':'−')+Math.abs(d/prev*100).toFixed(1)+'%）' : '';
  return `<span class="num ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${signed(d)}${pct}</span>`;
}
function parseAmt(s){ const n=parseFloat(String(s).replace(/[,，\s¥]/g,'')); return isFinite(n)?r2(n):NaN; }
function nowYM(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function ymAdd(ym,n){ let [y,m]=ym.split('-').map(Number); m+=n-1; y+=Math.floor(m/12); m=(m%12+12)%12+1; return y+'-'+String(m).padStart(2,'0'); }
function ymLabel(ym){ const [y,m]=ym.split('-'); return y+'年'+Number(m)+'月'; }
function ymShort(ym){ const [y,m]=ym.split('-'); return y.slice(2)+'/'+Number(m); }
function recorded(){ return Object.keys(D.months).sort(); }
function prevRecorded(ym){ const r=recorded().filter(k=>k<ym); return r.length?r[r.length-1]:null; }
function total(ym){ return D.months[ym] ? r2(D.months[ym].items.reduce((s,i)=>s+i.amount,0)) : 0; }
function byCat(ym){ const m={}; (D.months[ym]?D.months[ym].items:[]).forEach(i=>{ m[i.cat]=r2((m[i.cat]||0)+i.amount); }); return m; }
function catOrder(keys){ return keys.sort((a,b)=>{ const x=D.cats.indexOf(a), y=D.cats.indexOf(b); return (x<0?99:x)-(y<0?99:y); }); }
let toastT; function toast(s){ const t=$('#toast'); t.textContent=s; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

/* ================= 状态 / 路由 ================= */
const TABS = [
  ['assets','资产','<path d="M3 7h18v12H3z"/><path d="M3 7l2-3h14l2 3"/><circle cx="16.5" cy="13" r="1.3"/>'],
  ['stats','统计','<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'],
  ['exp','固定开支','<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'],
  ['set','设置','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>']
];
const S = { tab: (location.hash.slice(1).split('/')[0])||'assets', ym: nowYM(), statMode: location.hash.includes('/year')?'year':'month', range:'12', selM:null, selY:null };
if(!TABS.some(t=>t[0]===S.tab)) S.tab='assets';
function go(tab){ S.tab=tab; render(); window.scrollTo(0,0); }
function render(){
  $('#tabs').innerHTML = TABS.map(t=>`<button class="tab ${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')"><svg viewBox="0 0 24 24">${t[2]}</svg>${t[1]}</button>`).join('');
  ({assets:renderAssets, stats:renderStats, exp:renderExp, set:renderSet})[S.tab]();
}

/* ================= 资产页 ================= */
function renderAssets(){
  const ym=S.ym, rec=D.months[ym], prev=prevRecorded(ym), isNow = ym===nowYM();
  let h = `<div class="mnav">
    <button class="arrow" onclick="S.ym=ymAdd(S.ym,-1);render()" aria-label="上个月">‹</button>
    <div class="title" onclick="pickMonth()">${ymLabel(ym)}<small>${isNow?'本月':'点此跳转月份'}</small></div>
    <button class="arrow" onclick="S.ym=ymAdd(S.ym,1);render()" aria-label="下个月">›</button></div>`;
  if(!rec){
    h += `<div class="card empty"><div class="ico">🗒️</div><p>${ymLabel(ym)} 还没有记录</p>`;
    if(prev){
      h += `<button class="btn" onclick="carry()">带入 ${ymLabel(prev)} 的数据</button>
        <div class="tiny" style="margin:8px 0 14px">${D.months[prev].items.length} 项，合计 ${money(total(prev))}，带入后在其基础上修改</div>
        <button class="btn ghost" onclick="startBlank()">从空白开始</button>`;
    } else h += `<button class="btn" onclick="startBlank(true)">开始记录</button>`;
    h += `</div>`;
  } else {
    const t=total(ym), pt = prev?total(prev):null;
    h += `<div class="card hero"><div class="label">总资产</div><div class="big num">${money(t)}</div>
      <div class="delta">${prev?'<span class="muted">较'+ymLabel(prev)+'　</span>'+deltaHTML(t,pt,true):'<span class="muted">首次记录</span>'}</div></div>`;
    const prevMap={}; if(prev) D.months[prev].items.forEach(i=>prevMap[i.id]=i.amount);
    const groups={}; rec.items.forEach(i=>(groups[i.cat]=groups[i.cat]||[]).push(i));
    for(const c of catOrder(Object.keys(groups))){
      const sum=r2(groups[c].reduce((s,i)=>s+i.amount,0));
      h += `<div class="group-h"><b>${esc(c)}</b><span class="num">${money(sum)}${t>0?' · '+(sum/t*100).toFixed(1)+'%':''}</span></div><div class="list">`;
      for(const i of groups[c]){
        const d = prev ? (i.id in prevMap ? deltaHTML(i.amount,prevMap[i.id]) : '<span class="tiny">本月新增</span>') : '';
        h += `<button class="row" onclick="editAsset('${i.id}')"><div class="l"><div class="name">${esc(i.name)}</div>${i.note?`<div class="tiny">${esc(i.note)}</div>`:''}</div>
          <div class="r"><div class="amt num">${money(i.amount)}</div><div class="tiny">${d}</div></div><span class="chev">›</span></button>`;
      }
      h += `</div>`;
    }
    if(!rec.items.length) h += `<div class="card empty"><p>还没有资产，点下方按钮添加</p></div>`;
    h += `<button class="btn" style="margin-top:16px" onclick="editAsset()">＋ 添加资产</button>
      <button class="btn danger" onclick="delMonth()">删除本月记录</button>`;
  }
  $('#app').innerHTML = h;
}
function carry(){
  const prev=prevRecorded(S.ym); if(!prev) return;
  D.months[S.ym] = {items: D.months[prev].items.map(i=>Object.assign({},i))};
  save(); render(); toast('已带入 '+ymLabel(prev)+' 的数据');
}
function startBlank(andAdd){ D.months[S.ym]={items:[]}; save(); render(); if(andAdd) editAsset(); }
function delMonth(){
  if(!confirm('确定删除 '+ymLabel(S.ym)+' 的全部记录？此操作无法撤销。')) return;
  delete D.months[S.ym]; save(); render();
}
function pickMonth(){
  const [y,m]=S.ym.split('-');
  openSheet('跳转月份', `<div class="field"><label>月份</label><input id="f_ym" type="month" value="${S.ym}"></div>
    <button class="btn ghost" onclick="S.ym=nowYM();closeSheet();render()">回到本月</button>`, ()=>{
    const v=$('#f_ym').value; if(/^\d{4}-\d{2}$/.test(v)) S.ym=v; return true; });
}
function catChips(sel){
  return `<div class="tiny" style="margin:4px 4px 6px">类别</div><div class="chips" id="f_cats">`+
    D.cats.map(c=>`<button class="chip ${c===sel?'on':''}" data-c="${esc(c)}" onclick="pickChip(this)">${esc(c)}</button>`).join('')+`</div>`;
}
function pickChip(el){ el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); el.classList.add('on'); }
function editAsset(id){
  const items=D.months[S.ym].items, it = id ? items.find(i=>i.id===id) : null;
  const cats = it && !D.cats.includes(it.cat) ? null : 1;
  if(!cats) D.cats.push(it.cat);
  openSheet(it?'编辑资产':'添加资产', `
    <div class="field"><label>名称</label><input id="f_name" placeholder="如：招商银行存款" value="${esc(it?it.name:'')}" autocomplete="off"></div>
    <div class="field"><label>金额（元）</label><input id="f_amt" inputmode="decimal" placeholder="0.00" value="${it?it.amount:''}" autocomplete="off"></div>
    ${catChips(it?it.cat:D.cats[0])}
    <div class="field"><label>备注（可选）</label><input id="f_note" value="${esc(it?it.note||'':'')}" autocomplete="off"></div>
    ${it?`<button class="btn danger" onclick="delAsset('${it.id}')">删除这项资产</button>`:''}`, ()=>{
      const name=$('#f_name').value.trim(), amt=parseAmt($('#f_amt').value), chip=$('#f_cats .chip.on');
      if(!name){ toast('请填写名称'); return false; }
      if(isNaN(amt)){ toast('请填写正确的金额'); return false; }
      const o={name, amount:amt, cat:chip?chip.dataset.c:'其他', note:$('#f_note').value.trim()};
      if(it) Object.assign(it,o); else items.push(Object.assign({id:uid()},o));
      save(); return true;
    });
  if(!it) setTimeout(()=>$('#f_name')&&$('#f_name').focus(),250);
}
function delAsset(id){
  if(!confirm('从本月记录中删除这项资产？')) return;
  const m=D.months[S.ym]; m.items=m.items.filter(i=>i.id!==id); save(); closeSheet(); render();
}

/* ================= 统计页 ================= */
function renderStats(){
  const rec=recorded();
  let h=`<h1>统计</h1>`;
  if(!rec.length){ $('#app').innerHTML = h+`<div class="card empty"><div class="ico">📈</div><p>先在“资产”页记录至少一个月的数据</p></div>`; return; }
  h += `<div class="seg"><button class="${S.statMode==='month'?'on':''}" onclick="S.statMode='month';render()">按月</button>
        <button class="${S.statMode==='year'?'on':''}" onclick="S.statMode='year';render()">按年</button></div>`;
  if(S.statMode==='month'){
    const list = S.range==='12' ? rec.slice(-12) : rec;
    if(!S.selM || !list.includes(S.selM)) S.selM = list[list.length-1];
    h += `<div class="card"><div class="chart-h"><span class="t">总资产走势</span>
        <div class="seg small"><button class="${S.range==='12'?'on':''}" onclick="S.range='12';render()">近12月</button><button class="${S.range==='all'?'on':''}" onclick="S.range='all';render()">全部</button></div></div>
        <div class="tip" id="tipM"></div><div class="chart" id="chartM"></div>
        <div class="tiny" style="margin-top:6px">在图上滑动或点按可查看各月</div></div>
      <div class="card" id="brkM"></div>
      <div class="card"><div class="chart-h"><span class="t">逐月明细</span></div><table><tr><th>月份</th><th>总资产</th><th>较上次</th></tr>`+
      list.slice().reverse().map(k=>{ const p=prevRecorded(k); return `<tr><td>${ymLabel(k)}</td><td class="num">${money(total(k))}</td><td>${p?deltaHTML(total(k),total(p)):'<span class="tiny">—</span>'}</td></tr>`; }).join('')+
      `</table></div>`;
    $('#app').innerHTML=h;
    const upd=i=>{ S.selM=list[i]; const k=list[i], p=prevRecorded(k);
      $('#tipM').innerHTML=`<span><span class="muted">${ymLabel(k)}</span>　<span class="v num">${money(total(k))}</span></span><span style="font-size:13px">${p?deltaHTML(total(k),total(p),true):''}</span>`;
      $('#brkM').innerHTML=breakdown(k, ymLabel(k)+' 资产构成'); };
    drawChart($('#chartM'), {labels:list.map(ymShort), values:list.map(total), type:'line', sel:list.indexOf(S.selM), onSel:upd});
    upd(list.indexOf(S.selM));
  } else {
    const years=[...new Set(rec.map(k=>k.slice(0,4)))];
    const info=years.map(y=>{ const ms=rec.filter(k=>k.startsWith(y)); const last=ms[ms.length-1];
      const base=prevRecorded(y+'-01'); // 上一年最后一次记录
      const start = base || ms[0];
      return {y, n:ms.length, last, end:total(last), start, chg: (base||ms.length>1) ? r2(total(last)-total(start)) : null, startV: total(start)}; });
    if(!S.selY || !years.includes(S.selY)) S.selY=years[years.length-1];
    h += `<div class="card"><div class="chart-h"><span class="t">各年年末总资产</span></div>
        <div class="tip" id="tipY"></div><div class="chart" id="chartY"></div>
        <div class="tiny" style="margin-top:6px">年末值取该年最后一个有记录的月份；点按柱子查看该年</div></div>
      <div id="yearBox"></div>
      <div class="card"><div class="chart-h"><span class="t">逐年明细</span></div><table><tr><th>年份</th><th>年末总资产</th><th>年度变化</th></tr>`+
      info.slice().reverse().map(o=>`<tr><td>${o.y}年</td><td class="num">${money(o.end)}</td><td>${o.chg==null?'<span class="tiny">—</span>':deltaHTML(o.end,o.startV)}</td></tr>`).join('')+`</table></div>`;
    $('#app').innerHTML=h;
    const upd=i=>{ const o=info[i]; S.selY=o.y;
      $('#tipY').innerHTML=`<span><span class="muted">${o.y}年末</span>　<span class="v num">${money(o.end)}</span></span>`;
      const ms=rec.filter(k=>k.startsWith(o.y)), vals=ms.map(total);
      const hi=ms[vals.indexOf(Math.max(...vals))], lo=ms[vals.indexOf(Math.min(...vals))];
      $('#yearBox').innerHTML=`<div class="card"><div class="chart-h"><span class="t">${o.y}年 概览</span><span class="tiny">共记录 ${o.n} 个月</span></div>
        <div class="stat2"><div><div class="muted">年度变化</div><div class="v num">${o.chg==null?'—':'<span class="'+(o.chg>0?'up':o.chg<0?'down':'')+'">'+signed(o.chg)+'</span>'}</div>
          <div class="tiny">${o.chg==null?'仅一次记录':'自 '+ymLabel(o.start)+(o.startV?'，'+(o.chg>=0?'+':'−')+Math.abs(o.chg/o.startV*100).toFixed(1)+'%':'')}</div></div>
        <div><div class="muted">月均变化</div><div class="v num">${o.chg==null?'—':signed(o.chg/Math.max(1,monthsBetween(o.start,o.last)))}</div>
          <div class="tiny">最高 ${ymShort(hi)} · 最低 ${ymShort(lo)}</div></div></div></div>
        <div class="card">${breakdown(o.last, ymLabel(o.last)+' 资产构成', o.start!==o.last?o.start:null)}</div>`; };
    drawChart($('#chartY'), {labels:years.map(y=>y+'年'), values:info.map(o=>o.end), type:'bar', sel:years.indexOf(S.selY), onSel:upd});
    upd(years.indexOf(S.selY));
  }
}
function monthsBetween(a,b){ const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number); return (y2-y1)*12+m2-m1; }
function breakdown(ym, title, cmp){
  const m=byCat(ym), t=total(ym), keys=Object.keys(m).sort((a,b)=>m[b]-m[a]), max=Math.max(1,...keys.map(k=>m[k]));
  if(cmp===undefined) cmp=prevRecorded(ym);
  const pm = cmp?byCat(cmp):null;
  return `<div class="chart-h"><span class="t">${esc(title)}</span>${cmp?`<span class="tiny">对比 ${ymShort(cmp)}</span>`:''}</div>`+
    (keys.length?keys.map(k=>`<div class="bar-row"><div class="top"><span>${esc(k)} <span class="tiny">${t>0?(m[k]/t*100).toFixed(1)+'%':''}</span></span>
      <span class="num">${money(m[k])} <span style="font-size:12px">${pm?deltaHTML(m[k],pm[k]||0):''}</span></span></div>
      <div class="track"><div class="fill" style="width:${Math.max(0,m[k])/max*100}%"></div></div></div>`).join(''):'<div class="muted">无数据</div>');
}

/* ---- SVG 图表（单序列折线 / 柱状） ---- */
function niceTicks(lo,hi,n){
  if(hi===lo){ const p=Math.abs(hi)*0.1||1; lo-=p; hi+=p; }
  const raw=(hi-lo)/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/mag;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;
  const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step, t=[];
  for(let v=a; v<=b+step/2; v+=step) t.push(r2(v));
  return t;
}
function drawChart(el, o){
  const W=el.clientWidth||320, H=180, pl=44, pr=12, pt=10, pb=22, n=o.values.length;
  let lo=Math.min(...o.values), hi=Math.max(...o.values);
  if(o.type==='bar'){ lo=Math.min(0,lo); hi=Math.max(0,hi)||1; }
  else if(lo>=0){ const pad=(hi-lo)*0.15; lo=Math.max(0,lo-pad); }
  const ticks=niceTicks(lo,hi,3); lo=ticks[0]; hi=ticks[ticks.length-1];
  const iw=W-pl-pr, ih=H-pt-pb;
  const band=iw/n, x=i=> o.type==='bar' ? pl+band*(i+.5) : (n===1? pl+iw/2 : pl+iw*i/(n-1));
  const y=v=> pt+ih*(1-(v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">`;
  ticks.forEach(t=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+3.5}" text-anchor="end">${compact(t)}</text>`; });
  const every=Math.ceil(n/(o.type==='bar'?8:6));
  for(let i=n-1;i>=0;i-=every) s+=`<text x="${x(i)}" y="${H-5}" text-anchor="${o.type==='line'&&i===n-1&&n>1?'end':'middle'}">${o.labels[i]}</text>`;
  if(o.type==='bar'){
    const bw=Math.min(36, band-2>4?band*0.6:band-2), y0=y(0);
    o.values.forEach((v,i)=>{ const yy=y(v), top=Math.min(yy,y0), hgt=Math.max(1,Math.abs(yy-y0)), r=Math.min(4,bw/2,hgt);
      s+=`<path class="bar" data-i="${i}" fill="var(--accent)" d="M${x(i)-bw/2},${y0} V${top+r} q0,${-r} ${r},${-r} H${x(i)+bw/2-r} q${r},0 ${r},${r} V${y0} Z"/>`; });
  } else {
    s+=`<line id="cx" y1="${pt}" y2="${pt+ih}" stroke="var(--text3)" stroke-width="1" stroke-dasharray="3 3"/>`;
    if(n>1) s+=`<path fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M${o.values.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' L')}"/>`;
    if(n<=24) o.values.forEach((v,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${n===1?4:2.5}" fill="var(--accent)"/>`; });
    s+=`<circle id="dot" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`;
  }
  el.innerHTML=s+'</svg>';
  let cur=-1;
  const mark=i=>{ if(i===cur) return; cur=i;
    if(o.type==='bar') el.querySelectorAll('.bar').forEach((b,j)=>b.setAttribute('opacity', j===i?1:.4));
    else { const cx=el.querySelector('#cx'), dot=el.querySelector('#dot'); cx.setAttribute('x1',x(i)); cx.setAttribute('x2',x(i)); dot.setAttribute('cx',x(i)); dot.setAttribute('cy',y(o.values[i])); }
    o.onSel(i); };
  const pick=e=>{ const r=el.getBoundingClientRect(), px=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    let i = o.type==='bar' ? Math.floor((px-pl)/band) : (n===1?0:Math.round((px-pl)/iw*(n-1)));
    mark(Math.max(0,Math.min(n-1,i))); };
  el.onpointerdown=pick; el.onpointermove=e=>{ if(e.pointerType!=='mouse'||e.buttons||true) pick(e); };
  cur=-1; const i0=Math.max(0,o.sel);
  if(o.type==='bar') el.querySelectorAll('.bar').forEach((b,j)=>b.setAttribute('opacity', j===i0?1:.4));
  else { const cx=el.querySelector('#cx'), dot=el.querySelector('#dot'); cx.setAttribute('x1',x(i0)); cx.setAttribute('x2',x(i0)); dot.setAttribute('cx',x(i0)); dot.setAttribute('cy',y(o.values[i0])); }
  cur=i0;
}

/* ================= 固定开支 ================= */
function expMonthly(e){ return e.amount/CYCLES[e.cycle].m; }
function renderExp(){
  const list=D.expenses, perM=r2(list.reduce((s,e)=>s+expMonthly(e),0)), perY=r2(perM*12);
  let h=`<h1>固定开支</h1><div class="card"><div class="stat2">
    <div><div class="muted">折合每月</div><div class="v num">${money(perM)}</div></div>
    <div><div class="muted">全年合计</div><div class="v num">${money(perY)}</div></div></div></div>`;
  if(!list.length) h+=`<div class="card empty"><div class="ico">🧾</div><p>记录话费、保险、房贷等固定开支</p></div>`;
  for(const c of Object.keys(CYCLES)){
    const g=list.filter(e=>e.cycle===c); if(!g.length) continue;
    h+=`<div class="group-h"><b>${CYCLES[c].t}</b><span class="num">${money(g.reduce((s,e)=>s+e.amount,0))}</span></div><div class="list">`+
      g.map(e=>`<button class="row" onclick="editExp('${e.id}')"><div class="l"><div class="name">${esc(e.name)}</div>${e.note?`<div class="tiny">${esc(e.note)}</div>`:''}</div>
        <div class="r"><div class="amt num">${money(e.amount)}</div>${c!=='month'?`<div class="tiny num">折合 ${money(expMonthly(e))}/月</div>`:''}</div><span class="chev">›</span></button>`).join('')+`</div>`;
  }
  h+=`<button class="btn" style="margin-top:16px" onclick="editExp()">＋ 添加固定开支</button>`;
  $('#app').innerHTML=h;
}
function editExp(id){
  const e = id ? D.expenses.find(x=>x.id===id) : null, cyc=e?e.cycle:'month';
  openSheet(e?'编辑固定开支':'添加固定开支', `
    <div class="field"><label>名称</label><input id="f_name" placeholder="如：房贷、话费、车险" value="${esc(e?e.name:'')}" autocomplete="off"></div>
    <div class="field"><label>金额（元）</label><input id="f_amt" inputmode="decimal" placeholder="0.00" value="${e?e.amount:''}" autocomplete="off"></div>
    <div class="tiny" style="margin:4px 4px 6px">周期</div><div class="chips" id="f_cyc">${Object.keys(CYCLES).map(c=>`<button class="chip ${c===cyc?'on':''}" data-c="${c}" onclick="pickChip(this)">${CYCLES[c].t}</button>`).join('')}</div>
    <div class="field"><label>备注（可选，如扣款日）</label><input id="f_note" value="${esc(e?e.note||'':'')}" autocomplete="off"></div>
    ${e?`<button class="btn danger" onclick="delExp('${e.id}')">删除这项开支</button>`:''}`, ()=>{
      const name=$('#f_name').value.trim(), amt=parseAmt($('#f_amt').value);
      if(!name){ toast('请填写名称'); return false; }
      if(isNaN(amt)||amt<0){ toast('请填写正确的金额'); return false; }
      const o={name, amount:amt, cycle:$('#f_cyc .chip.on').dataset.c, note:$('#f_note').value.trim()};
      if(e) Object.assign(e,o); else D.expenses.push(Object.assign({id:uid()},o));
      save(); return true;
    });
  if(!e) setTimeout(()=>$('#f_name')&&$('#f_name').focus(),250);
}
function delExp(id){ if(!confirm('删除这项固定开支？')) return; D.expenses=D.expenses.filter(e=>e.id!==id); save(); closeSheet(); render(); }

/* ================= 设置 ================= */
function renderSet(){
  const rec=recorded(), standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  let h=`<h1>设置</h1>`;
  if(!standalone) h+=`<div class="card"><b>安装到主屏幕</b><div class="muted" style="margin-top:4px">在 Safari 中点底部“分享”按钮 → “添加到主屏幕”。之后从主屏幕图标打开，无需联网即可使用。</div></div>`;
  h+=`<div class="group-h"><b>数据备份</b><span>${D.lastBackup?'上次导出 '+D.lastBackup:'尚未导出过'}</span></div>
    <div class="card"><div class="muted" style="margin-bottom:12px">所有数据只保存在这台手机上，不会上传。建议定期导出备份文件（可存到“文件”或 iCloud），换手机或误删应用时可恢复。</div>
      <button class="btn" onclick="exportData()">导出备份</button>
      <button class="btn ghost" onclick="$('#imp').click()">从备份恢复</button>
      <input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></div>
    <div class="group-h"><b>资产类别</b><span>点按可改名或删除</span></div><div class="list">`+
    D.cats.map((c,i)=>`<button class="row" onclick="editCat(${i})"><div class="l"><div class="name">${esc(c)}</div></div><span class="chev">›</span></button>`).join('')+
    `<button class="row" onclick="editCat(-1)"><div class="l" style="color:var(--accent)">＋ 新增类别</div></button></div>
    <div class="group-h"><b>数据概况</b></div><div class="card muted">已记录 ${rec.length} 个月${rec.length?'（'+ymLabel(rec[0])+' 至 '+ymLabel(rec[rec.length-1])+'）':''}，固定开支 ${D.expenses.length} 项。</div>
    <button class="btn danger" onclick="wipe()">清空全部数据</button>
    <div class="tiny" style="text-align:center;margin-top:14px">资产账本 v1.0 · 完全离线</div>`;
  $('#app').innerHTML=h;
}
function editCat(i){
  const old = i>=0?D.cats[i]:null;
  openSheet(old?'编辑类别':'新增类别', `<div class="field"><label>类别名称</label><input id="f_name" value="${esc(old||'')}" autocomplete="off"></div>
    ${old&&D.cats.length>1?`<button class="btn danger" onclick="delCat(${i})">删除这个类别</button>`:''}`, ()=>{
      const name=$('#f_name').value.trim(); if(!name){ toast('请填写名称'); return false; }
      if(name!==old && D.cats.includes(name)){ toast('已有同名类别'); return false; }
      if(old){ D.cats[i]=name; Object.values(D.months).forEach(m=>m.items.forEach(it=>{ if(it.cat===old) it.cat=name; })); }
      else D.cats.push(name);
      save(); return true; });
  if(!old) setTimeout(()=>$('#f_name')&&$('#f_name').focus(),250);
}
function delCat(i){
  const c=D.cats[i], used=Object.values(D.months).some(m=>m.items.some(it=>it.cat===c));
  const to=D.cats.find(x=>x!==c && x==='其他') || D.cats.find(x=>x!==c);
  if(!confirm(used?`“${c}”下还有资产，删除后这些资产会归入“${to}”。继续？`:`删除类别“${c}”？`)) return;
  if(used) Object.values(D.months).forEach(m=>m.items.forEach(it=>{ if(it.cat===c) it.cat=to; }));
  D.cats.splice(i,1); save(); closeSheet(); render();
}
async function exportData(){
  const d=new Date(), stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  D.lastBackup=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const name='资产账本备份-'+stamp+'.json', text=JSON.stringify(D,null,1);
  try{
    const file=new File([text],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); save(); render(); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); save(); render();
}
function importData(inp){
  const f=inp.files[0]; inp.value=''; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ let d=null; try{ d=normalize(JSON.parse(rd.result)); }catch(e){}
    if(!d){ alert('这不是有效的备份文件'); return; }
    const n=Object.keys(d.months).length;
    if(!confirm(`备份中有 ${n} 个月的资产记录、${d.expenses.length} 项固定开支。\n恢复后将覆盖当前手机上的全部数据，确定继续？`)) return;
    D=d; save(); render(); toast('已恢复'); };
  rd.readAsText(f);
}
function wipe(){
  if(!confirm('确定清空全部数据？建议先导出备份。')) return;
  if(!confirm('再次确认：所有资产记录和固定开支都将被删除，无法恢复。')) return;
  D=blank(); save(); render();
}

/* ================= 底部弹层 ================= */
let sheetSave=null;
function openSheet(title, body, onSave){
  sheetSave=onSave;
  $('#sheet').innerHTML=`<div class="sheet-h"><button onclick="closeSheet()">取消</button><b>${esc(title)}</b><button onclick="submitSheet()" style="font-weight:600">保存</button></div>${body}`;
  $('#mask').classList.add('show');
}
function submitSheet(){ if(sheetSave && sheetSave()===false) return; closeSheet(); render(); }
function closeSheet(){ if(document.activeElement) document.activeElement.blur(); $('#mask').classList.remove('show'); sheetSave=null; }
$('#mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && $('#mask').classList.contains('show') && e.target.tagName==='INPUT'){ e.preventDefault(); submitSheet(); } });

/* ================= 启动 ================= */
render();
let rzT; addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(S.tab==='stats' && !$('#mask').classList.contains('show')) render(); },200); });
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
